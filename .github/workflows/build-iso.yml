name: VaskOS CI Slim Compilation Engine

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-vaskos-slim:
    runs-on: ubuntu-24.04
    
    steps:
    - name: Checkout Repository Source Code
      uses: actions/checkout@v4

    - name: Install Deployment Toolkit on Host
      run: |
        sudo apt-get update
        sudo apt-get install -y debootstrap squashfs-tools xorriso syslinux isolinux syslinux-common initramfs-tools grub-pc-bin grub-efi-amd64-bin mtools ubuntu-keyring
    
    - name: Step 1 - Bootstrap Ultra-Minimal Base System
      run: |
        M_HOST="archive"
        M_DOMAIN="ubuntu.com"
        FINAL_URL="http://${M_HOST}.${M_DOMAIN}/ubuntu"
        
        # Переключаем вариант на minbase для максимальной экономии места
        sudo debootstrap \
          --arch=amd64 \
          --variant=minbase \
          noble \
          /tmp/vaskos-chroot \
          ${FINAL_URL}

    - name: Step 1.5 - Mount Subsystems & Configure DNS
      run: |
        sudo mkdir -p /tmp/vaskos-chroot/{dev,dev/pts,proc,sys,etc}
        
        sudo mount --bind /dev /tmp/vaskos-chroot/dev
        sudo mount --bind /dev/pts /tmp/vaskos-chroot/dev/pts
        sudo mount --bind /proc /tmp/vaskos-chroot/proc
        sudo mount --bind /sys /tmp/vaskos-chroot/sys
        sudo rm -f /tmp/vaskos-chroot/etc/resolv.conf
        sudo cp /etc/resolv.conf /tmp/vaskos-chroot/etc/resolv.conf

    - name: Step 2 - Internal Chroot Software Deployment (Diet Mode)
      run: |
        sudo chroot /tmp/vaskos-chroot /bin/bash -c '
          M_HOST="archive"
          M_DOMAIN="ubuntu.com"
          echo "deb http://${M_HOST}.${M_DOMAIN}/ubuntu noble main restricted universe multiverse" > /etc/apt/sources.list
          echo "deb http://ubuntu.com noble-security main restricted universe multiverse" >> /etc/apt/sources.list
          
          # Очищаем кэш и отключаем установку рекомендуемого мусора
          apt-get update
          
          # Устанавливаем базовый системный слой
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ubuntu-minimal systemd systemd-sysv apt locales kmod sudo

          # Устанавливаем ядро, базовую сетевую прошивку (вместо linux-firmware) и PipeWire
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            linux-image-generic live-boot nic-firmware firmware-sof-signed alsa-utils pipewire pipewire-audio-client-libraries \
            wpasupplicant network-manager systemd-resolved udevil eject language-pack-ru language-pack-uk

          # Устанавливаем ультралегкую графику Иксов, IceWM и быстрый текстовый терминал
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            xserver-xorg-core xserver-xorg-video-all xserver-xorg-input-all xinit icewm idesk hicolor-icon-theme feh xterm zathura zathura-pdf-poppler

          # ФИКС: Установка легковесного офиса (AbiWord + Gnumeric) вместо LibreOffice
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            abiword gnumeric

          # Настройка локализации
          echo -e "en_US.UTF-8 UTF-8\nru_RU.UTF-8 UTF-8\nuk_UA.UTF-8 UTF-8" > /etc/locale.gen
          locale-gen
          echo -e "LANG=ru_RU.UTF-8\nLANGUAGE=\"ru_RU:ru:uk_UA:uk\"" > /etc/default/locale

          # Фикс сети и автологина
          systemctl enable systemd-resolved
          ln -sf /run/systemd/resolve/stub-resolv.conf /etc/resolv.conf

          mkdir -p /etc/systemd/system/getty@tty1.service.d
          echo -e "[Service]\nExecStart=\nExecStart=-/sbin/agetty --autologin root --noclear %I \$TERM" > /etc/systemd/system/getty@tty1.service.d/override.conf

          echo -e "\nif [ -z \"\$DISPLAY\" ] && [ \"\$(tty)\" = \"/dev/tty1\" ]; then\n  export DISPLAY=:0\n  startx\nfi" >> /root/.bashprofile
          cp /root/.bashprofile /root/.bash_profile 2>/dev/null || true

          # Сборка initramfs со сжатием GZIP
          mkdir -p /etc/initramfs-tools
          echo "BOOT=live" >> /etc/initramfs-tools/initramfs.conf
          echo "COMPRESS=gzip" >> /etc/initramfs-tools/initramfs.conf
          update-initramfs -u -k all

          # Агрессивная очистка от мусора, кэшей и документации внутри образа
          apt-get clean
          rm -rf /usr/share/doc/* /usr/share/man/* /var/lib/apt/lists/*
        '

    - name: Step 2.5 - Safe Subsystem Unmounting
      run: |
        sudo umount -lf /tmp/vaskos-chroot/dev/pts || true
        sudo umount -lf /tmp/vaskos-chroot/dev || true
        sudo umount -lf /tmp/vaskos-chroot/proc || true
        sudo umount -lf /tmp/vaskos-chroot/sys || true

    - name: Step 3 - Structuring Staging Directories (Slim Layout)
      run: |
        mkdir -p /tmp/iso/live /tmp/iso/isolinux /tmp/iso/boot/grub
        sudo mkdir -p /tmp/vaskos-chroot/root/.idesktop
        
        if [ -f "wallpaper.jpg" ]; then
          sudo mkdir -p /tmp/vaskos-chroot/usr/share/backgrounds
          sudo cp wallpaper.jpg /tmp/vaskos-chroot/usr/share/backgrounds/vaskos-bg.jpg
        fi

        # Меняем ярлыки на рабочем столе на новые легковесные программы
        sudo printf 'table Link\n  Caption: AbiWord Текст\n  Command: abiword\n  Icon: /usr/share/icons/hicolor/48x48/apps/xterm.png\n  X: 50\n  Y: 50\nend\n' | sudo tee /tmp/vaskos-chroot/root/.idesktop/abiword.lnk
        sudo printf 'table Link\n  Caption: Gnumeric Таблицы\n  Command: gnumeric\n  Icon: /usr/share/icons/hicolor/48x48/apps/xterm.png\n  X: 50\n  Y: 150\nend\n' | sudo tee /tmp/vaskos-chroot/root/.idesktop/gnumeric.lnk
        sudo printf 'table Link\n  Caption: PDF Читалка\n  Command: zathura\n  Icon: /usr/share/icons/hicolor/48x48/apps/xterm.png\n  X: 50\n  Y: 250\nend\n' | sudo tee /tmp/vaskos-chroot/root/.idesktop/zathura.lnk
        
        sudo printf 'table Config\n  FontName: sans\n  FontSize: 11\n  FontColor: #ffffff\n  Appearance: v2\n  Refresh: 2000\n  Width: 48\n  Height: 48\n  FillSpace: true\n  Shadow: true\n  Lock: false\nend\n' | sudo tee /tmp/vaskos-chroot/root/.ideskrc

        sudo printf '#!/bin/sh\nexport DISPLAY=:0\nfeh --bg-scale /usr/share/backgrounds/vaskos-bg.jpg &\npipewire &\n/usr/libexec/bluetooth/bluetoothd &\ndevmon --exec-on-drive "notify-send '\''Диск подключен'\''" &\nidesk &\nsleep 1\nexec icewm\n' | sudo tee /tmp/vaskos-chroot/root/.xinitrc
        sudo chmod +x /tmp/vaskos-chroot/root/.xinitrc

    - name: Step 3.5 - Extracting Kernel and Compress SquashFS
      run: |
        sudo cp /tmp/vaskos-chroot/boot/vmlinuz-* /tmp/iso/live/vmlinuz
        sudo cp /tmp/vaskos-chroot/boot/initrd.img-* /tmp/iso/live/initrd.img
        # Сжатие с максимальным упором на экономию размера файловой системы Live-ОС
        sudo mksquashfs /tmp/vaskos-chroot /tmp/iso/live/filesystem.squashfs -e boot -noappend

    - name: Step 4 - Compiling Bootloader Files (BIOS + UEFI)
      run: |
        sudo cp /usr/lib/ISOLINUX/isolinux.bin /tmp/iso/isolinux/ 2>/dev/null || sudo cp /usr/lib/isolinux/isolinux.bin /tmp/iso/isolinux/
        sudo cp /usr/lib/syslinux/modules/bios/*.c32 /tmp/iso/isolinux/ 2>/dev/null || sudo cp /usr/lib/syslinux/*.c32 /tmp/iso/isolinux/

        sudo printf 'ui menu.c32\nprompt 0\ntimeout 50\nlabel live\n  menu label Start VaskOS Slim v26.1.60 (Diet Mode)\n  menu default\n  kernel /live/vmlinuz\n  append initrd=/live/initrd.img boot=live quiet splash locales=ru_RU.UTF-8\n' | sudo tee /tmp/iso/isolinux/isolinux.cfg
        sudo printf 'set default="0"\nset timeout=5\nmenuentry "Start VaskOS Slim v26.1.60 (UEFI Mode)" {\n    linux /live/vmlinuz boot=live quiet splash locales=ru_RU.UTF-8 ---\n    initrd /live/initrd.img\n}\n' | sudo tee /tmp/iso/boot/grub/grub.cfg

        dd if=/dev/zero of=/tmp/efiboot.img bs=1M count=4
        mkfs.vfat /tmp/efiboot.img
        mmd -i /tmp/efiboot.img ::/EFI ::/EFI/BOOT
        grub-mkimage -o /tmp/grubx64.efi -p /boot/grub -O x86_64-efi fat iso9660 part_gpt part_msdos normal boot linux configfile loopback chain search efi_gop efi_uga gfxterm minicmd
        mcopy -i /tmp/efiboot.img /tmp/grubx64.efi ::/EFI/BOOT/BOOTX64.EFI
        sudo mv /tmp/efiboot.img /tmp/iso/isolinux/efiboot.img

    - name: Step 5 - Compile Master Hybrid ISO via Xorriso
      run: |
        sudo xorriso -as mkisofs \
          -iso-level 3 \
          -full-iso9660-filenames \
          -R -l -J -joliet-long \
          -V "VaskOS_Slim" \
          -b isolinux/isolinux.bin \
          -c isolinux/boot.cat \
          -no-emul-boot -boot-load-size 4 -boot-info-table \
          -eltorito-alt-boot \
          -e isolinux/efiboot.img \
          -no-emul-boot \
          -o vaskos-26.1.60-slim.iso \
          /tmp/iso

    - name: Step 6 - Upload Completed ISO to GitHub Artifacts Storage
      uses: actions/upload-artifact@v4
      with:
        name: vaskos-slim-package
        path: vaskos-26.1.60-slim.iso
        if-no-files-found: error
        retention-days: 7
